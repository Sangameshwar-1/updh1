<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The 2050 Wall — station card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <!--
      Heading, question and the sticky-note instruction are curatorial copy,
      verbatim. The second half of the question -- who might be left out -- is
      the point of the station, so it is set on the card itself rather than
      left to the invigilator to ask.
    -->
    <div class="card">
      <div class="eyebrow">
        <span>Zone 4</span><span class="dot">&bull;</span><span>Interactive Activities</span
        ><span class="dot">&bull;</span><span class="num">Station 4</span>
      </div>

      <h1>The 2050 Wall</h1>

      <p class="prompt">
        It is 2050. How do you think people in India will send messages, and who might be left
        out?
      </p>

      <div class="body">
        <div class="note-row">
          <div class="note">In 2050, I think&hellip;</div>
          <div class="note-lines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
          </div>
        </div>

        <p class="instruction">Copy your answer onto a sticky note and add it to the wall.</p>
      </div>

      <footer>
        <span class="title">From Stone to Smartphone</span>
        <span>Team ChronoScribes &bull; 2026</span>
      </footer>
    </div>
  </body>
</html>
