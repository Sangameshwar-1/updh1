<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Decode the Symbol — station card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <!--
      Heading and prompt are curatorial copy and are reproduced verbatim.
      The exhibition does not claim a reading of the Indus script, so the
      prompt asks what a visitor thinks it could have said -- never what it
      says.
    -->
    <div class="card">
      <div class="eyebrow">
        <span>Zone 4</span><span class="dot">&bull;</span><span>Interactive Activities</span
        ><span class="dot">&bull;</span><span class="num">Station 1</span>
      </div>

      <h1>Decode the Symbol</h1>

      <p class="prompt">
        Nobody has yet been able to read the Indus script. Look closely at the seal. What do you
        think it could have said, and who might have used it?
      </p>

      <div class="body">
        <div class="lines">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>

      <footer>
        <span class="title">From Stone to Smartphone</span>
        <span>Team ChronoScribes &bull; 2026</span>
      </footer>
    </div>
  </body>
</html>
